<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bando's Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    color: #fff;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 24px;
    padding: 2.5rem 2rem;
    max-width: 560px;
    width: 100%;
    text-align: center;
    backdrop-filter: blur(20px);
  }

  .cat-avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e07b39, #f4a261);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.25rem;
    font-size: 52px;
    border: 3px solid rgba(255,255,255,0.2);
  }

  .cat-name {
    font-size: 3rem;
    font-weight: 700;
    letter-spacing: 0;
    margin-bottom: 0.3rem;
    color: #fff;
    font-family: 'Reem Kufi', serif;
    direction: rtl;
    unicode-bidi: isolate;
  }

  .cat-subtitle {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.55);
    margin-bottom: 2rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.1);
    margin: 1.5rem 0;
  }

  .section-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2.5px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 1rem;
  }

  .birthday-box {
    background: rgba(244,162,97,0.12);
    border: 1px solid rgba(244,162,97,0.3);
    border-radius: 14px;
    padding: 1rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .birthday-icon {
    font-size: 28px;
  }

  .birthday-date {
    font-size: 1.5rem;
    font-weight: 600;
    color: #f4a261;
    letter-spacing: 1px;
  }

  .birthday-sub {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
  }

  .age-section {
    margin-bottom: 1.5rem;
  }

  .counter-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-top: 0.75rem;
  }

  .counter-unit {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 0.85rem 0.5rem 0.6rem;
  }

  .counter-number {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    line-height: 1;
    display: block;
    font-variant-numeric: tabular-nums;
  }

  .counter-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,0.4);
    margin-top: 6px;
    display: block;
  }

  .next-birthday-box {
    background: rgba(99,179,237,0.08);
    border: 1px solid rgba(99,179,237,0.2);
    border-radius: 14px;
    padding: 1rem 1.5rem;
  }

  .next-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(99,179,237,0.7);
    margin-bottom: 0.5rem;
  }

  .next-value {
    font-size: 1.1rem;
    font-weight: 600;
    color: #90cdf4;
  }

  .live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #68d391;
    border-radius: 50%;
    margin-right: 6px;
    animation: pulse 1.5s infinite;
    vertical-align: middle;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .footer {
    margin-top: 1.75rem;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.25);
  }

  @media (max-width: 400px) {
    .counter-number { font-size: 1.5rem; }
    .counter-grid { gap: 6px; }
    .cat-name { font-size: 1.6rem; }
    .birthday-date { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="card">

  <div class="cat-avatar">🐱</div>
  <div class="cat-name">Bondok</div>
  <div class="cat-subtitle">Feline Profile</div>

  <p class="section-label">Birthday</p>
  <div class="birthday-box">
    <span class="birthday-icon">🎂</span>
    <div style="text-align:left">
      <div class="birthday-date" id="birthday-display">January 18, 2026</div>
      <div class="birthday-sub">Date of birth</div>
    </div>
  </div>

  <hr class="divider">

  <div class="age-section">
    <p class="section-label"><span class="live-dot"></span>Live Age Counter</p>
    <div class="counter-grid">
      <div class="counter-unit">
        <span class="counter-number" id="years">0</span>
        <span class="counter-label">Years</span>
      </div>
      <div class="counter-unit">
        <span class="counter-number" id="months">0</span>
        <span class="counter-label">Months</span>
      </div>
      <div class="counter-unit">
        <span class="counter-number" id="days">0</span>
        <span class="counter-label">Days</span>
      </div>
      <div class="counter-unit">
        <span class="counter-number" id="hours">0</span>
        <span class="counter-label">Hours</span>
      </div>
    </div>
  </div>

  <hr class="divider">

  <div class="next-birthday-box">
    <div class="next-label">Next Birthday</div>
    <div class="next-value" id="next-birthday">Calculating...</div>
  </div>

  <div class="footer" id="footer-note"></div>

</div>

<script>
  const BIRTHDAY = new Date(2026, 0, 18, 0, 0, 0);

  function update() {
    const now = new Date();
    const diff = now - BIRTHDAY;

    if (diff < 0) {
      document.getElementById('years').textContent = '0';
      document.getElementById('months').textContent = '0';
      document.getElementById('days').textContent = '0';
      document.getElementById('hours').textContent = '0';

      const daysUntil = Math.ceil(-diff / (1000 * 60 * 60 * 24));
      document.getElementById('next-birthday').textContent = 'Birthday in ' + daysUntil + ' day' + (daysUntil !== 1 ? 's' : '') + ' 🎉';
      document.getElementById('footer-note').textContent = 'Birthday has not arrived yet';
      return;
    }

    const totalMs = diff;
    const totalSec = Math.floor(totalMs / 1000);
    const totalMin = Math.floor(totalSec / 60);
    const totalHours = Math.floor(totalMin / 60);
    const totalDays = Math.floor(totalHours / 24);

    let years = now.getFullYear() - BIRTHDAY.getFullYear();
    let months = now.getMonth() - BIRTHDAY.getMonth();
    let days = now.getDate() - BIRTHDAY.getDate();

    if (days < 0) {
      months--;
      const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if (months < 0) {
      years--;
      months += 12;
    }

    document.getElementById('years').textContent = years;
    document.getElementById('months').textContent = months;
    document.getElementById('days').textContent = days;
    document.getElementById('hours').textContent = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

    const nextBday = new Date(now.getFullYear(), 0, 18);
    if (nextBday <= now) nextBday.setFullYear(now.getFullYear() + 1);
    const daysToNext = Math.ceil((nextBday - now) / (1000 * 60 * 60 * 24));

    if (daysToNext === 0) {
      document.getElementById('next-birthday').textContent = 'Today is the birthday! 🎉';
    } else {
      document.getElementById('next-birthday').textContent = daysToNext + ' day' + (daysToNext !== 1 ? 's' : '') + ' away — January 18, ' + nextBday.getFullYear();
    }

    document.getElementById('footer-note').textContent = 'Last updated: ' + now.toLocaleTimeString();
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
